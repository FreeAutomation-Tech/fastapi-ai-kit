[project]
name = "fastapi-ai-kit"
version = "0.1.0"
description = "Production-ready FastAPI template with multi-provider AI integration (OpenAI, Anthropic, Ollama)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "fastapi",
    "ai",
    "openai",
    "anthropic",
    "ollama",
    "api",
    "template",
    "python",
    "docker",
    "streaming",
    "sse",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
