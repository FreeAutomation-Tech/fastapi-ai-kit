[project]
name = "fastapi-ai-kit"
version = "0.2.0"
description = "Production-ready FastAPI Agent Backend — multi-provider AI, MCP SSE, agent execution, session memory, tool registry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "fastapi",
    "ai",
    "agent",
    "mcp",
    "openai",
    "anthropic",
    "ollama",
    "api",
    "template",
    "python",
    "docker",
    "streaming",
    "sse",
    "agent-backend",
    "tool-registry",
    "session-memory",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
